<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>荣耀 Magic5 Pro · DSH Remote</title>
  <style>
    @font-face { font-family: "HONOR Sans CN"; src: url("./fonts/HONORSansVFCN.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; background: #090b0e; font-family: "HONOR Sans CN", system-ui, sans-serif; }
    .phone { position: relative; width: min(375px, calc((100vh - 24px) * .4608)); height: min(814px, calc(100vh - 24px)); overflow: hidden; border-radius: 42px; background: #17181b; box-shadow: 0 24px 80px rgba(0,0,0,.52), 0 0 0 1px rgba(255,255,255,.12); }
    .phone iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .statusbar { position: absolute; z-index: 5; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center; padding: 3px 14px 0; color: #111; pointer-events: none; font-weight: 700; }
    .carrier { width: 61px; display: grid; gap: 0; font-size: 5.6px; line-height: 6.2px; letter-spacing: -.04em; }
    .clock { margin-left: 7px; font-size: 14px; line-height: 18px; letter-spacing: -.05em; }
    .status-icons { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 7px; line-height: 10px; }
    .signal { display: inline-flex; align-items: end; gap: 1px; height: 11px; }
    .signal i { display: block; width: 2px; border-radius: 1px; background: #111; }
    .signal i:nth-child(1) { height: 4px; opacity: .55; }
    .signal i:nth-child(2) { height: 6px; opacity: .7; }
    .signal i:nth-child(3) { height: 8px; opacity: .85; }
    .signal i:nth-child(4) { height: 10px; }
    .wifi { width: 14px; height: 10px; border: 2px solid #111; border-left-color: transparent; border-right-color: transparent; border-bottom-color: transparent; border-radius: 50% 50% 0 0; transform: translateY(2px); }
    .battery { position: relative; width: 18px; height: 10px; padding: 1px; border: 1.3px solid #111; border-radius: 3px; }
    .battery::after { content: ""; position: absolute; top: 2px; right: -3px; width: 2px; height: 4px; border-radius: 0 1px 1px 0; background: #111; }
    .battery::before { content: ""; display: block; width: 76%; height: 100%; border-radius: 1px; background: #4dbd69; }
  </style>
</head>
<body>
  <main class="phone" aria-label="荣耀 Magic5 Pro DSH Remote 模拟手机">
    <iframe id="remoteApp" title="荣耀 Magic5 Pro 上运行的 DSH Remote" src="./index.html?preview=magic5pro&source=remote-preview&view=chat&v=thinking-expand-2"></iframe>
    <div class="statusbar" aria-label="模拟状态栏">
      <span class="carrier"><span>中国移动</span><span>中国电信</span></span>
      <span class="clock">21:43</span>
      <span class="status-icons"><span>VPN</span><span>⌁</span><span>289<br><small>B/s</small></span><span class="wifi"></span><span>5G</span><span class="signal"><i></i><i></i><i></i><i></i></span><span>4G</span><span class="battery" aria-label="电量 77%"></span></span>
    </div>
  </main>
  <script>
    // The wrapper is only a device frame. It intentionally contains no
    // canned notification, chat, or reply data; the iframe renders live state.
    const remoteApp = document.getElementById('remoteApp');
    remoteApp.addEventListener('load', () => {
      const root = remoteApp.contentDocument?.documentElement;
      if (!root) return;
      root.style.setProperty('--native-safe-top', '30px');
      root.style.setProperty('--native-safe-bottom', '0px');
      root.style.setProperty('--native-keyboard-bottom', '0px');
    });
  </script>
</body>
</html>
